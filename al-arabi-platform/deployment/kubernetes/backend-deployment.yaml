apiVersion: apps/v1
kind: Deployment
metadata:
  name: al-arabi-backend
  namespace: al-arabi
  labels:
    app: al-arabi-backend
    tier: backend
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: al-arabi-backend
  template:
    metadata:
      labels:
        app: al-arabi-backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: al-arabi/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: al-arabi-config
              key: db-port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: al-arabi-config
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: db-password
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: jwt-refresh-secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: aws-secret-access-key
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: al-arabi-config
              key: aws-region
        - name: S3_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: al-arabi-config
              key: s3-bucket-name
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: stripe-secret-key
        - name: UNIFONIC_APP_SID
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: unifonic-app-sid
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: twilio-account-sid
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: al-arabi-secrets
              key: twilio-auth-token
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: al-arabi-uploads-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: al-arabi-logs-pvc
      securityContext:
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - al-arabi-backend
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: al-arabi-backend-service
  namespace: al-arabi
  labels:
    app: al-arabi-backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: al-arabi-backend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: al-arabi-uploads-pvc
  namespace: al-arabi
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: aws-efs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: al-arabi-logs-pvc
  namespace: al-arabi
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: aws-efs