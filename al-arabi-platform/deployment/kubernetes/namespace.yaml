apiVersion: v1
kind: Namespace
metadata:
  name: al-arabi
  labels:
    name: al-arabi
    environment: production
    app.kubernetes.io/name: al-arabi
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: al-arabi-quota
  namespace: al-arabi
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: al-arabi-limits
  namespace: al-arabi
spec:
  limits:
  - default:
      cpu: "1"
      memory: "1Gi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - default:
      storage: "1Gi"
    type: PersistentVolumeClaim